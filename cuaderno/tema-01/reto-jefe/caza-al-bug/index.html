<!DOCTYPE html>
<html lang="es">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>RetoJefe-CazaAlBug</title>
	<link rel="stylesheet" href="styles.css">
	<script src="app.js" defer></script>
</head>

<body>
	<main class="juego">
		<h1>👾 Caza al bug</h1>
		<p class="marcador">
			Puntos: <span id="puntos">0</span> · Tiempo: <span id="tiempo">30</span> s · Record: <span id="record">0</span>
		</p>
		<button id="jugar" class="boton">▶️ Jugar</button>
		<section id="tablero" class="tablero"></section>
		<p id="mensaje" class="mensaje" aria-live="polite"></p>
		<p class="ayuda">Bug normal: +1 · Bug dorado: +5 · Casilla vacia: -1</p>
	</main>
</body>

</html>
